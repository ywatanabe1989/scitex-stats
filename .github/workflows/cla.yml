name: CLA Assistant

# Org-level reusable-workflow caller (scitex-ai/.github; fleet CI
# unification wave 2). Triggers/permissions preserved verbatim from the
# prior local file — both the CLAssistant PR path and the owner-bypass
# direct-push path now live org-side (a shared workflow cannot drift
# per-repo). Reusable-workflow defaults (owner_login=ywatanabe1989,
# owner_allowlist="bot*,ywatanabe1989", default_branch=main) match this
# repo's prior hardcoded values, so no inputs are overridden.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]
  push:
    branches: [main, develop]
    tags: ['v*']

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  call:
    uses: scitex-ai/.github/.github/workflows/cla.yml@main
    # NAMED SECRET, not `inherit`. This caller runs on `issue_comment` and
    # `pull_request_target` -- both unauthenticated on a public repo -- and
    # `secrets: inherit` forwards EVERY secret this repo holds into a job an
    # outsider can start, on the shared self-hosted runner the callee targets.
    # Neither file shows that on its own: the caller names no runs-on, so the
    # destination lives in the callee. Pass only the secret the callee declares.
    secrets:
      GH_PERSONAL_ACCESS_TOKEN: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}
