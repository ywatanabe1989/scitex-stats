[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scitex-stats"
version = "0.2.11"
description = "Publication-ready statistical testing framework with 23 tests, effect sizes, power analysis, and MCP server"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.10"
authors = [
    { name = "Yusuke Watanabe", email = "ywatanabe@scitex.ai" },
]
keywords = [
    "statistics",
    "statistical-testing",
    "hypothesis-testing",
    "effect-size",
    "power-analysis",
    "publication",
    "apa",
    "scientific",
    "mcp",
    "mcp-server",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "matplotlib>=3.5.0",
    "mcp",
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "scipy>=1.7.0",
    "statsmodels>=0.13.0",
    "tabulate>=0.9.0",
]

[project.optional-dependencies]
figrecipe = [
    "figrecipe>=0.13.0",
]
mcp = [
    "fastmcp>=2.0.0",
]
plot = [
    "matplotlib>=3.5.0",
]
dev = [
    "fastmcp",
    "scitex",
    "scitex-dev",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-xdist>=3.0.0",
    "pre-commit>=3.5.0",
]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
    "myst-parser>=2.0",
    "sphinx-copybutton>=0.5",
    "sphinx-autodoc-typehints>=1.25",
]
all = [
    "scitex-stats[figrecipe]",
    "scitex-stats[mcp]",
    "scitex-stats[plot]",
]

[project.scripts]
scitex-stats = "scitex_stats._cli:main"

[project.entry-points."scitex_dev.docs"]
scitex-stats = "scitex_stats"

[project.entry-points."scitex_dev.skills"]

[project.entry-points."scitex_linter.plugins"]
stats = "scitex_stats._linter_plugin:get_plugin"

[project.urls]
Homepage = "https://github.com/ywatanabe1989/scitex-stats"
Documentation = "https://scitex-stats.readthedocs.io"
Repository = "https://github.com/ywatanabe1989/scitex-stats.git"
Issues = "https://github.com/ywatanabe1989/scitex-stats/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/scitex_stats"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short --cov=scitex_stats --cov-report=term-missing"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.scitex-linter]
library_dirs = ["src", "tests", "examples"]
